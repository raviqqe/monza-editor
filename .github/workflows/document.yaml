name: document
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - uses: actions/configure-pages@v6.0.0
      - run: pnpm -r build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: doc/dist
      - uses: actions/deploy-pages@v5.0.1
        if: github.ref == 'refs/heads/main'
  web_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: pnpm -r build
      - run: pnpm build --site http://localhost:4321/monza-editor
        working-directory: doc
      - run: pnpm preview &
        working-directory: doc
      - uses: raviqqe/muffy@v0.5.8
        with:
          config: muffy.local.toml
  web_release_test:
    needs:
      - web_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: raviqqe/muffy@v0.5.8
  document:
    needs:
      - web_build
      - web_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for result in ${{ join(needs.*.result, ' ') }}; do [ $result = success ]; done
